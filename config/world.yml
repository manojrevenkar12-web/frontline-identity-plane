# The simulated customers: manufacturers with plants, a workforce that joins, moves and leaves, an identity
# provider with its own habits, shared stations on the shop floor, and people who ask an AI agent to do things.
# Only src/fip/world/ reads this file. `heldout` overrides `dev` key by key and was written before the held-out run.

dev:
  weeks: 6
  tenants:
    - { name: brackwerk, idp: entra, protocol: saml, plants: [Augsburg, Pilsen], naming: site_func, clock_skew_s: 20 }
    - { name: lindqvist-pharma, idp: okta, protocol: oidc, plants: [Basel, Visp, Linz], naming: grp_func_site, clock_skew_s: 5 }
    - { name: ostmann-guss, idp: adfs, protocol: saml, plants: [Chemnitz], naming: cryptic_de, clock_skew_s: 95 }
  workforce:                       # people per plant, by function
    operators: [70, 140]
    quality: [6, 12]
    engineers: [4, 8]
    plant_it: [1, 3]
    managers: [6, 12]
    multi_plant_share: 0.25        # engineers and quality who also work at a second plant
    contractor_share: 0.08
  hr:                              # per person per week, and how long HR takes to reach the IdP
    leave_rate: 0.004
    join_rate: 0.004
    transfer_rate: 0.002
    promotion_rate: 0.0015
    temp_assignment_rate: 0.002
    temp_assignment_weeks: 2
    idp_lag_hours: { median: 2.0, sigma: 1.2 }   # HR record to IdP change, log-normal
  idp:                             # how each IdP pushes SCIM, and its quirks
    entra: { cycle_min: 40, failure_rate: 0.02, capitalised_ops: true, bool_strings: true, user_update: patch }
    okta: { cycle_min: 2, failure_rate: 0.01, capitalised_ops: false, bool_strings: false, user_update: put }
    adfs: { cycle_min: 15, failure_rate: 0.03, capitalised_ops: false, bool_strings: true, user_update: patch }
  status_quo:                      # how access changes without group sync: tickets to a plant admin
    ticket_hours: { median: 6.0, sigma: 1.0 }    # working hours to a fix
    cleanup_share: 0.25            # share of tickets where the admin also removes the access no longer needed
    blocked_minutes_per_ticket: 25
    admin_minutes_per_ticket: 12
    admin_minutes_per_group: 9     # mapping a group by hand at onboarding
  groups:
    junk_per_tenant: 8             # groups with no meaning for the product: VPN, all staff, test admins
  mapping_model:                   # how well a model reads group names, by naming style (hidden)
    site_func: { correct: 0.97, confidence: [0.85, 0.98] }
    grp_func_site: { correct: 0.95, confidence: [0.8, 0.97] }
    cryptic_de: { correct: 0.78, confidence: [0.55, 0.92] }
    junk: { proposes: 0.45, confidence: [0.6, 0.95] }
  stations:
    per_plant: 6
    changeovers_per_shift: 2       # someone else takes over a station mid-shift
    no_tap_share: 0.35             # the next person just starts working
    gap_minutes: [1, 25]
    signatures_per_shift: 3
  agent:                           # people asking an AI assistant to act in the product
    requests_per_person_week: 0.6
    mix: { app.view: 0.45, record.write: 0.25, app.edit: 0.2, record.approve: 0.1 }
    leaver_jobs_weeks: 2           # scheduled jobs a leaver set up keep firing this long
  attacks:
    attempts_per_kind: 3
  legit_logins_per_tenant: 40

heldout:
  weeks: 6
  tenants:
    - { name: vossberg-automotive, idp: entra, protocol: saml, plants: [Ingolstadt, Győr, Zwickau], naming: site_func, clock_skew_s: 30 }
    - { name: aaltonen-medtech, idp: okta, protocol: oidc, plants: [Tuttlingen], naming: grp_func_site, clock_skew_s: 3 }
    - { name: kessler-kunststoff, idp: adfs, protocol: saml, plants: [Lüdenscheid, Pirna], naming: cryptic_de, clock_skew_s: 160 }
    - { name: rhenus-chem, idp: ping, protocol: saml, plants: [Ludwigshafen], naming: grp_func_site, clock_skew_s: 10 }
  hr:
    leave_rate: 0.006
    transfer_rate: 0.003
    idp_lag_hours: { median: 3.0, sigma: 1.4 }
  idp:
    ping: { cycle_min: 20, failure_rate: 0.05, capitalised_ops: true, bool_strings: false, user_update: put }
  groups:
    junk_per_tenant: 14
  mapping_model:
    cryptic_de: { correct: 0.7, confidence: [0.5, 0.93] }
    junk: { proposes: 0.6, confidence: [0.65, 0.97] }
  stations:
    no_tap_share: 0.45

tiny:
  weeks: 1
  tenants:
    - { name: tiny-a, idp: entra, protocol: saml, plants: [Augsburg], naming: site_func, clock_skew_s: 10 }
    - { name: tiny-b, idp: okta, protocol: oidc, plants: [Basel, Visp], naming: cryptic_de, clock_skew_s: 5 }
  workforce:
    operators: [12, 18]
    quality: [2, 3]
    engineers: [1, 2]
    plant_it: [1, 1]
    managers: [1, 2]
  hr:
    leave_rate: 0.04
    join_rate: 0.03
    transfer_rate: 0.03
    promotion_rate: 0.02
    temp_assignment_rate: 0.02
  groups:
    junk_per_tenant: 3
  stations:
    per_plant: 2
  attacks:
    attempts_per_kind: 1
  legit_logins_per_tenant: 6
